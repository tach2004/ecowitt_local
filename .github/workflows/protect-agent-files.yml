name: Protect Agent Instruction Files

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-agent-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check for changes to agent instruction files
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} \
            --name-only \
            --repo "${{ github.repository }}")

          echo "Changed files:"
          echo "$CHANGED"

          PROTECTED=""
          for f in AGENTS.md CLAUDE.md AGENT_SYSTEM_PROMPT.md .github/CODEOWNERS; do
            if echo "$CHANGED" | grep -qx "$f"; then
              PROTECTED="$PROTECTED $f"
            fi
          done

          if [ -n "$PROTECTED" ]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
            echo "files=$PROTECTED" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize required maintainer review
        if: steps.check.outputs.protected == 'true'
        env:
          PROTECTED_FILES: ${{ steps.check.outputs.files }}
        run: |
          {
            echo "## Agent instruction files modified"
            echo ""
            echo "Changed protected files:"
            for f in $PROTECTED_FILES; do
              printf -- '- `%s`\n' "$f"
            done
            echo ""
            echo "Maintainer review is required before merging these changes."
            echo "CODEOWNERS identifies @tach2004 as the reviewer in this fork."
            echo "This workflow reports changes; required review must be enforced through repository branch protection or rulesets."
          } >> "$GITHUB_STEP_SUMMARY"
